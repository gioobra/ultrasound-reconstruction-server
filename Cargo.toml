[workspace]
resolver = "2"
members = ["crates/aps-core", "crates/aps-tools"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
bytemuck = "1"
memmap2 = "0.9"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "fat"
codegen-units = 1
